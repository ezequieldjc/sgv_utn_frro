name: "Copilot Setup Steps"

# Prepara el entorno del Copilot cloud agent antes de que empiece a trabajar:
# deja instaladas las dependencias del backend y del frontend para que pueda correr
# los tests sin perder tiempo (ni créditos) instalando todo en cada tarea.
# Solo se activa cuando este archivo está en la rama por defecto (main).

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # El job tiene que llamarse exactamente copilot-setup-steps.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python (misma versión que el CI)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias del backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci
