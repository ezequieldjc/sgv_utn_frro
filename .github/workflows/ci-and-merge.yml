name: CI y Merge a Main

on:
  push:
    branches: [ staging ]

jobs:
  pruebas-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias y ejecutar pruebas
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          cd backend && pytest

  fusionar-a-main:
    needs: pruebas-ci
    runs-on: ubuntu-latest
    steps:
      - name: Generar token del Bot
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Actualizar main desde staging
        run: |
          git config user.name "bot-merge-sgv-utn[bot]"
          git config user.email "bot-merge-sgv-utn[bot]@users.noreply.github.com"
          git checkout main
          git merge origin/staging --ff-only
          git push origin main